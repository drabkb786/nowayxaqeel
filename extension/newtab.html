<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="wallpaper-layer">
      <img id="wallpaper-img" alt="" />
      <video id="wallpaper-video" autoplay muted loop playsinline></video>
      <div id="wallpaper-overlay"></div>
    </div>

    <main id="app">
      <!-- Top row: greeting + clock -->
      <header class="top-row">
        <div id="greeting" class="glass soft"></div>
        <div id="clock-widget" class="glass soft">
          <div id="clock-time">--:--</div>
          <div id="clock-date"></div>
        </div>
      </header>

      <!-- Center: search -->
      <section class="center">
        <div id="search-shell" class="glass search-shell">
          <button id="engine-btn" class="engine-btn" title="Change search engine" aria-label="Search engine">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <span id="engine-name">Google</span>
          </button>
          <input id="search-input" type="text" placeholder="Search the web…" autocomplete="off" spellcheck="false" />
          <kbd class="hint">⏎</kbd>
        </div>
        <div id="engine-menu" class="glass engine-menu hidden" role="menu"></div>
      </section>

      <!-- Favorites -->
      <section class="favorites-wrap">
        <div id="favorites" class="favorites"></div>
      </section>
    </main>

    <!-- Left toolbar -->
    <aside id="toolbar" class="toolbar glass" aria-label="Toolbar">
      <button data-tool="bookmarks" title="Bookmarks" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button data-tool="topsites" title="Top sites" aria-label="Top sites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
      </button>
      <button data-tool="add-fav" title="Add favorite" aria-label="Add favorite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="spacer"></div>
      <button data-tool="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </aside>

    <!-- Settings panel -->
    <aside id="settings-panel" class="settings-panel glass" aria-hidden="true">
      <header class="sp-header">
        <h2>Settings</h2>
        <button id="settings-close" aria-label="Close">✕</button>
      </header>
      <nav class="sp-tabs">
        <button class="sp-tab active" data-tab="appearance">Appearance</button>
        <button class="sp-tab" data-tab="wallpaper">Wallpaper</button>
        <button class="sp-tab" data-tab="search">Search</button>
        <button class="sp-tab" data-tab="backup">Backup</button>
      </nav>
      <div class="sp-body">
        <section class="sp-section active" data-section="appearance">
          <div class="row">
            <label>Theme</label>
            <div class="segment" data-segment="theme">
              <button data-value="dark">Dark</button>
              <button data-value="light">Light</button>
              <button data-value="oled">OLED</button>
            </div>
          </div>
          <div class="row">
            <label>Accent</label>
            <div id="accent-swatches" class="swatches"></div>
          </div>
          <div class="row">
            <label>Glass blur <span class="val" data-val="glassBlur">20</span>px</label>
            <input type="range" min="0" max="60" data-setting="glassBlur" />
          </div>
          <div class="row">
            <label>Corner radius <span class="val" data-val="radius">16</span>px</label>
            <input type="range" min="0" max="40" data-setting="radius" />
          </div>
          <div class="row">
            <label>Transparency <span class="val" data-val="transparency">40</span>%</label>
            <input type="range" min="0" max="100" data-setting="transparency" />
          </div>
          <div class="row">
            <label>Reduced motion</label>
            <input type="checkbox" data-setting="reducedMotion" />
          </div>
        </section>

        <section class="sp-section" data-section="wallpaper">
          <div class="row">
            <label>Upload image or video</label>
            <input id="wp-upload" type="file" accept="image/*,video/mp4,video/webm" />
          </div>
          <div class="row">
            <label>Fit</label>
            <div class="segment" data-segment="wpFit">
              <button data-value="cover">Cover</button>
              <button data-value="contain">Fit</button>
              <button data-value="fill">Fill</button>
              <button data-value="center">Center</button>
            </div>
          </div>
          <div class="row"><label>Blur <span class="val" data-val="wpBlur">0</span>px</label><input type="range" min="0" max="40" data-setting="wpBlur" /></div>
          <div class="row"><label>Brightness <span class="val" data-val="wpBrightness">100</span>%</label><input type="range" min="20" max="150" data-setting="wpBrightness" /></div>
          <div class="row"><label>Contrast <span class="val" data-val="wpContrast">100</span>%</label><input type="range" min="50" max="200" data-setting="wpContrast" /></div>
          <div class="row"><label>Saturation <span class="val" data-val="wpSaturation">100</span>%</label><input type="range" min="0" max="200" data-setting="wpSaturation" /></div>
          <div class="row"><label>Overlay <span class="val" data-val="wpOverlay">30</span>%</label><input type="range" min="0" max="90" data-setting="wpOverlay" /></div>
          <div class="row"><label>Parallax</label><input type="checkbox" data-setting="parallax" /></div>
          <button id="wp-reset" class="btn ghost">Reset to default wallpaper</button>
        </section>

        <section class="sp-section" data-section="search">
          <div class="row">
            <label>Default engine</label>
            <select id="default-engine">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="brave">Brave</option>
              <option value="perplexity">Perplexity</option>
              <option value="chatgpt">ChatGPT</option>
              <option value="gemini">Gemini</option>
            </select>
          </div>
          <p class="hint-text">Tip: press <kbd>Tab</kbd> in the search bar to cycle engines.</p>
        </section>

        <section class="sp-section" data-section="backup">
          <p class="hint-text">Export a JSON of every setting, favorite, and wallpaper preference. Import to restore on any device.</p>
          <div class="btn-row">
            <button id="btn-export" class="btn">Export JSON</button>
            <button id="btn-import" class="btn">Import JSON</button>
            <input id="import-file" type="file" accept="application/json" hidden />
          </div>
          <button id="btn-reset" class="btn danger">Reset everything</button>
        </section>
      </div>
    </aside>

    <!-- Add favorite modal -->
    <div id="fav-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel glass">
        <h3 id="fav-modal-title">Add favorite</h3>
        <label>Name<input id="fav-name" type="text" placeholder="Lovable" /></label>
        <label>URL<input id="fav-url" type="url" placeholder="https://lovable.dev" /></label>
        <div class="btn-row">
          <button id="fav-cancel" class="btn ghost">Cancel</button>
          <button id="fav-save" class="btn">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
